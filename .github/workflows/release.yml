name: Release
on:
  push:
    branches:
      - master
    paths:
      - "src-tauri/tauri.conf.json"
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Type of release (main, beta, hotfix)'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - beta
          - hotfix
      tag_name:
        description: 'Tag name to update (required for hotfix, e.g., v1.2.3)'
        required: false
        type: string
      build_windows:
        description: 'Build Windows'
        required: false
        default: true
        type: boolean
      build_linux:
        description: 'Build Linux'
        required: false
        default: true
        type: boolean
      build_flatpak:
        description: 'Build Flatpak'
        required: false
        default: true
        type: boolean
      build_macos:
        description: 'Build macOS'
        required: false
        default: true
        type: boolean
      build_android:
        description: 'Build Android'
        required: false
        default: true
        type: boolean
      overwrite:
        description: 'Overwrite existing assets (only for hotfix)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Create GitHub Release (pre-creates tag + release so parallel jobs never race)
  # ---------------------------------------------------------------------------
  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.info.outputs.version }}
      tag_name: ${{ steps.info.outputs.tag_name }}
      prerelease: ${{ steps.info.outputs.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set version and prerelease flags
        id: info
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          INPUT_RELEASE_TYPE: ${{ inputs.release_type }}
          GH_EVENT_NAME: ${{ github.event_name }}
        run: |
          TAG_NAME=""
          if [ "$GH_EVENT_NAME" = "push" ]; then
            VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
            PRERELEASE=false
          elif [ "$INPUT_RELEASE_TYPE" = "beta" ]; then
            VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)-beta
            PRERELEASE=true
          elif [ "$INPUT_RELEASE_TYPE" = "hotfix" ]; then
            VERSION=$(echo "$INPUT_TAG_NAME" | sed 's/^v//')
            PRERELEASE=false
            TAG_NAME="$INPUT_TAG_NAME"
            case "$TAG_NAME" in
              v*) ;;
              *) TAG_NAME="v$TAG_NAME" ;;
            esac
          else
            VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
            PRERELEASE=false
          fi
          if [ -z "$TAG_NAME" ]; then TAG_NAME="v$VERSION"; fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.1
        with:
          tag_name: ${{ steps.info.outputs.tag_name }}
          name: ${{ steps.info.outputs.tag_name }}
          body_path: releasenote.md
          prerelease: ${{ steps.info.outputs.prerelease }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Windows Build
  # ---------------------------------------------------------------------------
  release-windows:
    runs-on: windows-latest
    needs: create-release
    if: |
      github.event_name == 'push' || inputs.build_windows == true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup (Node, Rust, cache, deps)
        uses: ./.github/actions/setup
        with:
          platform: windows

      - name: Build Tauri app
        shell: pwsh
        run: |
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Build attempt $attempt of $maxAttempts"
            npm run tauri build
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq $maxAttempts) {
              Write-Host "::error::Tauri build failed after $maxAttempts attempts"
              exit $LASTEXITCODE
            }
            Write-Host "Build failed (likely a transient WiX3 download issue), clearing WiX cache and retrying in 15s..."
            Remove-Item -Recurse -Force "$env:LOCALAPPDATA\tauri\WixTools314" -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 15
          }
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Set version and prerelease flags
        id: info
        shell: pwsh
        run: |
          echo "version=${{ needs.create-release.outputs.version }}" >> $env:GITHUB_OUTPUT
          echo "prerelease=${{ needs.create-release.outputs.prerelease }}" >> $env:GITHUB_OUTPUT
          echo "tag_name=${{ needs.create-release.outputs.tag_name }}" >> $env:GITHUB_OUTPUT

      - name: Upload compiled exe for MSIX packaging job
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: src-tauri/target/release/audion.exe
          retention-days: 1

      - name: Rename artifacts
        shell: pwsh
        run: |
          $ver = "${{ steps.info.outputs.version }}"
          Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | Rename-Item -NewName "audion_${ver}_windows.msi"
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Rename-Item -NewName "audion_${ver}_windows.exe"
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe.sig | Rename-Item -NewName "audion_${ver}_windows.exe.sig"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3.0.1
        with:
          tag_name: ${{ steps.info.outputs.tag_name }}
          overwrite_files: ${{ inputs.overwrite }}
          files: |
            src-tauri/target/release/bundle/msi/audion_*_windows.msi
            src-tauri/target/release/bundle/nsis/audion_*_windows.exe
            src-tauri/target/release/bundle/nsis/audion_*_windows.exe.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Discord notification
        if: success()
        shell: pwsh
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VERSION: ${{ steps.info.outputs.version }}
          TAG_NAME: ${{ steps.info.outputs.tag_name }}
        run: |
          if (-not $env:DISCORD_WEBHOOK_URL) { return }
          $payload = @{
            embeds = @(
              @{
                title = "🪟 Windows build $env:TAG_NAME"
                description = "Windows release has been ${{ github.event_name == 'push' && 'created' || 'updated' }}"
                color = 1947988
                url = "https://github.com/${{ github.repository }}/releases/tag/v$env:VERSION"
              }
            )
          } | ConvertTo-Json
          Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK_URL -Method Post -Body $payload -ContentType "application/json"

  # ---------------------------------------------------------------------------
  # Windows MSIX Build
  # ---------------------------------------------------------------------------
  release-windows-msix:
    runs-on: windows-latest
    needs: [create-release, release-windows]
    if: needs.release-windows.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup (Node, Rust, cache, deps)
        uses: ./.github/actions/setup
        with:
          platform: windows

      - name: Download compiled exe from build job
        uses: actions/download-artifact@v6
        with:
          name: windows-exe
          path: src-tauri/target/release

      - name: Decode MSIX signing cert
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String("${{ secrets.MSIX_CERT_BASE64 }}")
          [IO.File]::WriteAllBytes("audion-msix.pfx", $bytes)

      - name: Build MSIX bundle (sideload, self-signed)
        run: npm run tauri:windows:build -- --runner npm
        env:
          MSIX_PFX_PASSWORD: ${{ secrets.MSIX_CERT_PASSWORD }}

      - name: Rename MSIX artifact
        shell: pwsh
        run: |
          $ver = "${{ needs.create-release.outputs.version }}"
          Get-ChildItem src-tauri/target/msix/*.msix | Rename-Item -NewName "audion_${ver}_windows.msix"

      - name: Clean up cert from workspace
        if: always()
        shell: pwsh
        run: Remove-Item -Path audion-msix.pfx -ErrorAction SilentlyContinue

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3.0.1
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          overwrite_files: ${{ inputs.overwrite }}
          files: |
            src-tauri/target/msix/audion_*_windows.msix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Discord notification
        if: success()
        shell: pwsh
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VERSION: ${{ needs.create-release.outputs.version }}
          TAG_NAME: ${{ needs.create-release.outputs.tag_name }}
        run: |
          if (-not $env:DISCORD_WEBHOOK_URL) { return }
          $payload = @{
            embeds = @(
              @{
                title = "📦 Windows MSIX build $env:TAG_NAME"
                description = "Windows MSIX package has been ${{ github.event_name == 'push' && 'created' || 'updated' }}"
                color = 1947988
                url = "https://github.com/${{ github.repository }}/releases/tag/v$env:VERSION"
              }
            )
          } | ConvertTo-Json
          Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK_URL -Method Post -Body $payload -ContentType "application/json"


# ---------------------------------------------------------------------------
# Linux Build — Universal AppImage (GPU-safe, Bazzite/immutable distro compat)
# ---------------------------------------------------------------------------
  release-linux:
    runs-on: ubuntu-22.04        # ← 22.04, NOT 24.04 (older glibc = broader compat)
    needs: create-release
    if: |
      github.event_name == 'push' || inputs.build_linux == true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup (Node, Rust, cache, deps)
        uses: ./.github/actions/setup
        with:
          platform: linux

      - name: Build Tauri app
        run: |
          xvfb-run -a \
            --server-args="-screen 0 1920x1080x24 -ac +extension GLX +render -noreset" \
            npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Patch AppImage with GPU-safe wrapper script
        run: |
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" | head -1)
          if [ -z "$APPIMAGE" ]; then echo "No AppImage found"; exit 1; fi
          echo "Patching: $APPIMAGE"

          # Extract AppImage
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract
          
          # Inject wrapper that auto-detects GPU environment at runtime
          cat > squashfs-root/AppRun-real << 'WRAPPER_EOF'
          #!/bin/bash
          # The AppImage runtime sets $APPDIR (and $APPIMAGE) itself, before
          # it ever invokes AppRun, as part of mounting the squashfs — that
          # value is correct regardless of what a launcher wrapper does to
          # argv[0]/$0. Trust an inherited APPDIR first.
          #
          # Only fall back to recomputing HERE if APPDIR wasn't inherited
          # (e.g. a very old runtime). Note /proc/self/exe is NOT usable
          # here: for a shell script it resolves to the bash interpreter's
          # own path, not this script's location — that's what caused the
          # false-positive "could not resolve" failure with the previous
          # version of this wrapper.
          if [ -n "$APPDIR" ] && [ -d "$APPDIR/usr/bin" ]; then
            HERE="$APPDIR"
          else
            HERE="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          fi

          # If HERE still isn't an absolute path pointing at a real AppDir,
          # fail loud here instead of letting WebKit surface a confusing
          # "No such file or directory" several layers down.
          if [[ "$HERE" != /* ]] || [ ! -d "$HERE/usr/bin" ]; then
            echo "Audion: could not resolve the AppImage's own directory (got '$HERE')." >&2
            echo "This usually means the AppImage was launched through a wrapper" >&2
            echo "(e.g. AppImageLauncher's binfmt-bypass) that altered argv[0]." >&2
            echo "Try running the AppImage directly: ./Audion*.AppImage" >&2
            exit 1
          fi

          # ---------------------------------------------------------------------------
          # GPU / WebKit environment auto-detection
          # Bazzite and other immutable distros may have Wayland-only or broken EGL.
          # ---------------------------------------------------------------------------

          # APPDIR must be set so WebKit can find its helper processes (WebKitNetworkProcess etc.)
          export APPDIR="$HERE"

          # Some WebKitGTK builds resolve the WebKitNetworkProcess/WebKitWebProcess
          # helper path relative to the process's *current working directory*,
          # not (only) $APPDIR — if cwd is anything else (e.g. left over from
          # AppImageLauncher's exec chain), WebKit ends up trying a bogus
          # "./lib/.../WebKitNetworkProcess" path. Force cwd to the AppDir.
          cd "$HERE" || {
            echo "Audion: failed to cd into AppDir '$HERE'" >&2
            exit 1
          }

          # Always disable dmabuf renderer — it is the most common cause of blank screens on Mesa/NVIDIA
          export WEBKIT_DISABLE_DMABUF_RENDERER=1

          # Disable GVfs modules that have broken symbols on some distros (e.g. Mint 22 / Ubuntu 24)
          # This prevents "undefined symbol: g_task_set_static_name" from libgvfscommon.so
          export GIO_USE_VFS=local
          export GIO_MODULE_DIR="$HERE/usr/lib/gio/modules"

          # Make the BUNDLED shared libraries take priority over whatever's on
          # the host system. If a previous ldd check (in the diagnostic dump
          # below) shows a dependency resolving against the wrong version on
          # the user's machine, this is what fixes it — without it, the
          # dynamic linker searches the host's own library paths first and
          # the bundled webkit2gtk-4.1 libs never even get considered for
          # anything except the exact directory WebKit hardcodes.
          export LD_LIBRARY_PATH="$HERE/usr/lib/x86_64-linux-gnu:$HERE/usr/lib:${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"

          # WebKitGTK's UIProcess honors WEBKIT_EXEC_PATH as an override for
          # where it looks for WebKitNetworkProcess/WebKitWebProcess, IF the
          # running libwebkit2gtk build actually checks it (not all do — an
          # earlier manual test of this alone showed no effect, which either
          # means this webkit2gtk build ignores it, or it was shadowed by
          # something else; setting it here costs nothing and the diagnostic
          # dump below will show its final value so we can tell which).
          export WEBKIT_EXEC_PATH="$HERE/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1"

          # XDG paths, in case GTK/GIO schema or MIME lookups are also
          # falling back to the host and pulling in mismatched versions.
          export XDG_DATA_DIRS="$HERE/usr/share:${XDG_DATA_DIRS:-/usr/local/share:/usr/share}"

          # Wayland detection — prefer X11 fallback for WebKitGTK 4.x stability
          if [ -n "$WAYLAND_DISPLAY" ] && [ -z "$FORCE_WAYLAND" ]; then
            export GDK_BACKEND=x11
            export QT_QPA_PLATFORM=xcb
          fi

          # ALSA/audio safety
          if [ -z "$ALSA_CONFIG_PATH" ] && [ -f /usr/share/alsa/alsa.conf ]; then
            export ALSA_CONFIG_PATH=/usr/share/alsa/alsa.conf
          fi

          # Robust binary detection
          if [ -f "$HERE/usr/bin/Audion" ]; then
            BIN="$HERE/usr/bin/Audion"
          elif [ -f "$HERE/usr/bin/audion" ]; then
            BIN="$HERE/usr/bin/audion"
          else
            BIN=$(find "$HERE/usr/bin" -type f -executable | head -1)
          fi

          # ---------------------------------------------------------------------------
          # Full runtime diagnostic dump — printed unconditionally, every launch,
          # right before we hand off to the real binary. This exists so a failed
          # launch on someone else's machine is self-contained: everything we've
          # had to debug by hand across several rounds (argv0/APPDIR mangling,
          # cwd, the usr/lib vs lib path split, whether the bundled WebKit helper
          # binaries' shared-lib deps resolve on THEIR system, and now the raw
          # execve/openat syscalls themselves if strace is available) is captured
          # from one run, written to disk, with its path printed so it survives
          # even if terminal scrollback doesn't.
          # ---------------------------------------------------------------------------
          DIAG_OUT="${TMPDIR:-/tmp}/audion-launch-diagnostics-$$.log"
          {
            echo "===== Audion launch diagnostics ====="
            echo "date: $(date -u --iso-8601=seconds 2>&1)"
            echo "uname: $(uname -a 2>&1)"
            echo "argv[0]: $0"
            echo "BASH_SOURCE[0]: ${BASH_SOURCE[0]}"
            echo "inherited \$APPDIR (pre-override): ${APPDIR:-<unset>}"
            echo "resolved HERE: $HERE"
            echo "cwd (post-cd): $(pwd)"
            echo "selected BIN: ${BIN:-<none found>}"
            echo
            echo "--- Effective env vars we set ---"
            for v in APPDIR LD_LIBRARY_PATH WEBKIT_EXEC_PATH WEBKIT_DISABLE_DMABUF_RENDERER \
                     GIO_USE_VFS GIO_MODULE_DIR XDG_DATA_DIRS GDK_BACKEND QT_QPA_PLATFORM \
                     WAYLAND_DISPLAY DISPLAY ALSA_CONFIG_PATH; do
              echo "  $v=${!v:-<unset>}"
            done
            echo
            echo "--- glibc / dynamic linker (cross-distro version skew check) ---"
            ldd --version 2>&1 | head -1
            echo
            echo "--- usr/lib webkit2gtk-4.1 path ---"
            ls -la "$HERE/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1" 2>&1 | head -20
            echo "--- root lib webkit2gtk-4.1 path (symlink) ---"
            ls -la "$HERE/lib/x86_64-linux-gnu/webkit2gtk-4.1" 2>&1 | head -20
            echo
            echo "--- WebKitNetworkProcess: existence + shared-lib resolution on THIS machine ---"
            WKNP="$HERE/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1/WebKitNetworkProcess"
            if [ -e "$WKNP" ]; then
              echo "found at: $WKNP"
              echo "file: $(file -b "$WKNP" 2>&1)"
              echo "ldd output (a missing '=> not found' line here IS the bug, if present):"
              ldd "$WKNP" 2>&1 | sed 's/^/  /'
            else
              echo "NOT FOUND at $WKNP — bundling step did not ship it, or AppDir layout differs."
            fi
            echo "======================================"
          } | tee "$DIAG_OUT" >&2
          echo "Full diagnostics also written to: $DIAG_OUT" >&2

          # ---------------------------------------------------------------------------
          # GPU detection + software-rendering fallback.
          #
          # Two layers, cheapest first:
          #  1. A fast pre-check: does an accessible DRI render node exist at
          #     all? If not, there's no point even attempting hardware
          #     rendering — force software mode immediately, no visible
          #     crash/flash for the user.
          #  2. If a render node DOES exist but WebKit still fails to get an
          #     EGL context (permissions, Zink issues, a render node that
          #     exists but doesn't actually work — exactly what happened in
          #     testing on this Fedora box), the first launch attempt is
          #     captured rather than exec'd directly, so on an EGL failure we
          #     can relaunch once with software rendering forced instead of
          #     leaving the user stuck on a raw EGL_BAD_PARAMETER crash.
          #
          # This keeps hardware acceleration for everyone whose GPU actually
          # works, and only pays the software-rendering performance cost for
          # machines where hardware rendering was never going to work anyway.
          # ---------------------------------------------------------------------------
          EGL_FAILURE_PATTERN='Could not create default EGL display|EGL_BAD_PARAMETER|failed to choose pdev|failed to create dri2 screen'

          # Optional syscall-level trace, off by default (the webkit path
          # bug this originally existed to diagnose is fixed) — set
          # AUDION_STRACE=1 to re-enable if something new comes up.
          STRACE_WRAP=""
          if [ "${AUDION_STRACE:-0}" = "1" ] && command -v strace >/dev/null 2>&1; then
            STRACE_OUT="${TMPDIR:-/tmp}/audion-strace-$$.log"
            echo "AUDION_STRACE=1 — tracing syscalls to: $STRACE_OUT" >&2
            STRACE_WRAP="strace -f -e trace=execve,openat,stat,access -o $STRACE_OUT"
          fi

          HAS_DRI=0
          for dev in /dev/dri/renderD*; do
            [ -e "$dev" ] && [ -r "$dev" ] && [ -w "$dev" ] && HAS_DRI=1 && break
          done

          if [ "$HAS_DRI" -eq 0 ]; then
            echo "Audion: no accessible DRI render node found — forcing software rendering." >&2
            export LIBGL_ALWAYS_SOFTWARE=1
            export WEBKIT_DISABLE_COMPOSITING_MODE=1
            exec $STRACE_WRAP "$BIN" "$@"
          fi

          # A render node exists — try hardware rendering first, but capture
          # stderr so a hard EGL failure can trigger one automatic retry in
          # software mode instead of just crashing.
          LAUNCH_LOG="${TMPDIR:-/tmp}/audion-launch-$$.log"
          $STRACE_WRAP "$BIN" "$@" 2> >(tee "$LAUNCH_LOG" >&2)
          STATUS=$?

          if [ "$STATUS" -ne 0 ] && grep -qE "$EGL_FAILURE_PATTERN" "$LAUNCH_LOG" 2>/dev/null; then
            echo "Audion: hardware GL/EGL initialization failed — retrying with software rendering..." >&2
            export LIBGL_ALWAYS_SOFTWARE=1
            export WEBKIT_DISABLE_COMPOSITING_MODE=1
            exec $STRACE_WRAP "$BIN" "$@"
          fi

          exit "$STATUS"
          WRAPPER_EOF

          chmod +x squashfs-root/AppRun-real

          # ---------------------------------------------------------------------------
          # Work around tauri-apps/tauri#12463 / #6992: Tauri's AppImage bundler
          # (linuxdeploy under the hood) does not reliably bundle WebKitGTK's
          # helper-process directory (WebKitNetworkProcess, WebKitWebProcess,
          # the injected-bundle .so) into usr/lib/.../webkit2gtk-4.1/, and
          # even when present, WebKit's compiled-in lookup for it is relative
          # to lib/x86_64-linux-gnu/... at the AppDir ROOT (no "usr/" prefix
          # — that's the literal bug in #6992). We copy the real directory
          # from the runner (installed via libwebkit2gtk-4.1-dev in
          # setup/action.yml) into usr/lib/... (FHS-correct location) and
          # ALSO expose it at lib/... via symlink (where WebKit actually
          # looks), then verify at build time — not just "the files exist"
          # but "the ELF interpreter and every shared-lib dependency the
          # helper binaries need actually resolves" — because a missing
          # dependency at runtime produces the exact same glib "No such
          # file or directory" as a missing path, and that ambiguity is
          # why this took several round-trips to pin down.
          # ---------------------------------------------------------------------------
          WEBKIT_LIBDIR="/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1"
          DIAG_LOG="squashfs-root/webkit-bundle-diagnostics.log"
          {
            echo "=== WebKitGTK bundle diagnostics (build time) ==="
            echo "Generated: $(date -u --iso-8601=seconds)"
            echo "Runner: $(uname -a)"
            echo

            if [ -d "$WEBKIT_LIBDIR" ]; then
              echo "Source dir found: $WEBKIT_LIBDIR"
              echo "--- Contents ---"
              ls -la "$WEBKIT_LIBDIR"
              echo

              mkdir -p "squashfs-root/usr/lib/x86_64-linux-gnu"
              cp -aL --remove-destination "$WEBKIT_LIBDIR" \
                "squashfs-root/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1"

              mkdir -p "squashfs-root/lib"
              if [ ! -e "squashfs-root/lib/x86_64-linux-gnu" ]; then
                ln -s "../usr/lib/x86_64-linux-gnu" "squashfs-root/lib/x86_64-linux-gnu"
              fi

              echo "--- Post-copy: both lookup paths, resolved ---"
              echo "usr/lib path: $(readlink -f squashfs-root/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1 2>&1)"
              echo "root lib path (symlink target): $(readlink -f squashfs-root/lib/x86_64-linux-gnu/webkit2gtk-4.1 2>&1)"
              echo

              echo "--- ELF interpreter + shared-lib dependency check ---"
              for helper in WebKitNetworkProcess WebKitWebProcess; do
                HP="squashfs-root/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1/$helper"
                echo "[$helper]"
                if [ ! -e "$HP" ]; then
                  echo "  MISSING from bundled dir entirely."
                  continue
                fi
                echo "  file: $(file -b "$HP" 2>&1)"
                echo "  interpreter: $(patchelf --print-interpreter "$HP" 2>&1 || readelf -p .interp "$HP" 2>&1 | tail -1)"
                echo "  ldd:"
                ldd "$HP" 2>&1 | sed 's/^/    /'
                echo
              done
            else
              echo "WARNING: $WEBKIT_LIBDIR not found on runner (ubuntu-22.04)." 
              echo "This build will almost certainly hit the WebKitNetworkProcess"
              echo "spawn failure (tauri-apps/tauri#12463) — check that"
              echo "libwebkit2gtk-4.1-dev is still installed in setup/action.yml."
            fi
          } | tee "$DIAG_LOG"
          echo "Full diagnostics written to $DIAG_LOG (bundled inside the AppImage, viewable via --appimage-extract)."

          # Back up original AppRun and replace
          if [ -L squashfs-root/AppRun ]; then
            # If it's a symlink, resolve it and move the target
            ORIG_TARGET=$(readlink squashfs-root/AppRun)
            mv "squashfs-root/$ORIG_TARGET" squashfs-root/AppRun-original
            rm squashfs-root/AppRun
          else
            mv squashfs-root/AppRun squashfs-root/AppRun-original
          fi

          cat > squashfs-root/AppRun << 'APPRUN_EOF'
          #!/bin/bash
          if [ -n "$APPDIR" ] && [ -f "$APPDIR/AppRun-real" ]; then
            HERE="$APPDIR"
          else
            HERE="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          fi
          exec "$HERE/AppRun-real" "$@"
          APPRUN_EOF
          chmod +x squashfs-root/AppRun

          # Repack the AppImage
          # NOTE: appimagetool is itself an AppImage. GitHub Actions runners do not
          # have libfuse.so.2 (FUSE 2). Setting APPIMAGE_EXTRACT_AND_RUN=1 makes the
          # AppImage runtime self-extract to a tmpdir and exec without FUSE.
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" \
            -O /tmp/appimagetool
          chmod +x /tmp/appimagetool

          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 /tmp/appimagetool --no-appstream squashfs-root \
            "src-tauri/target/release/bundle/appimage/audion-patched.AppImage"

          # Clean up extracted dir
          rm -rf squashfs-root

      - name: Set version and prerelease flags
        id: info
        run: |
          echo "version=${{ needs.create-release.outputs.version }}" >> $GITHUB_OUTPUT
          echo "prerelease=${{ needs.create-release.outputs.prerelease }}" >> $GITHUB_OUTPUT
          echo "tag_name=${{ needs.create-release.outputs.tag_name }}" >> $GITHUB_OUTPUT

      - name: Rename and repackage artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          VER="${{ steps.info.outputs.version }}"
          BUNDLE="src-tauri/target/release/bundle"

          # Rename DEB
          DEB_FILE=$(find "${BUNDLE}/deb" -name "*.deb" | head -1)
          if [ -n "$DEB_FILE" ]; then
            mv "$DEB_FILE" "${BUNDLE}/deb/audion_${VER}_linux.deb"
          fi

          # Rename patched AppImage
          mv "${BUNDLE}/appimage/audion-patched.AppImage" \
             "${BUNDLE}/appimage/audion_${VER}_linux.AppImage"

          # Re-tar and re-sign from the patched AppImage.
          # createUpdaterArtifacts produced a .tar.gz during build but wrapped
          # the unpatched binary — discard it and regenerate from the patched one.
          rm -f "${BUNDLE}"/appimage/*.AppImage.tar.gz \
                "${BUNDLE}"/appimage/*.AppImage.tar.gz.sig
          tar -czf "${BUNDLE}/appimage/audion_${VER}_linux.AppImage.tar.gz" \
            -C "${BUNDLE}/appimage" "audion_${VER}_linux.AppImage"
          npm run tauri -- signer sign \
            "${BUNDLE}/appimage/audion_${VER}_linux.AppImage.tar.gz" \
            --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
            --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3.0.1
        with:
          tag_name: ${{ steps.info.outputs.tag_name }}
          overwrite_files: ${{ inputs.overwrite }}
          files: |
            src-tauri/target/release/bundle/deb/audion_*_linux.deb
            src-tauri/target/release/bundle/appimage/audion_*_linux.AppImage
            src-tauri/target/release/bundle/appimage/audion_*_linux.AppImage.tar.gz
            src-tauri/target/release/bundle/appimage/audion_*_linux.AppImage.tar.gz.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Discord notification
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VERSION: ${{ steps.info.outputs.version }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then exit 0; fi
          curl -H "Content-Type: application/json" -X POST \
            -d "{\"embeds\": [{\"title\": \"🐧 Linux build v$VERSION\", \"description\": \"Linux release updated\", \"color\": 1947988, \"url\": \"https://github.com/${{ github.repository }}/releases/tag/v$VERSION\"}]}" \
            "$DISCORD_WEBHOOK_URL"

  # ---------------------------------------------------------------------------
  # Flatpak Build
  # ---------------------------------------------------------------------------
  release-flatpak:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    needs: create-release
    if: |
      github.event_name == 'push' || inputs.build_flatpak == true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set version and prerelease flags
        id: info
        run: |
          echo "version=${{ needs.create-release.outputs.version }}" >> $GITHUB_OUTPUT
          echo "prerelease=${{ needs.create-release.outputs.prerelease }}" >> $GITHUB_OUTPUT
          echo "tag_name=${{ needs.create-release.outputs.tag_name }}" >> $GITHUB_OUTPUT

      - name: Configure Flathub remote (system scope)
        run: |
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak remotes --system

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/com.audion.app.yml
          repository-name: flathub
          repository-url: https://flathub.org/repo/flathub.flatpakrepo
          bundle: audion_${{ steps.info.outputs.version }}_flatpak.flatpak
          cache-key: flatpak-builder-${{ runner.os }}-${{ hashFiles('packaging/flatpak/*.yml') }}-v1
          upload-artifact: false
          verbose: true

      - name: Verify Flatpak bundle
        run: |
          ls -la
          ls -la *.flatpak || true
          test -f "audion_${{ steps.info.outputs.version }}_flatpak.flatpak"

      - name: Upload Flatpak to GitHub Release
        uses: softprops/action-gh-release@v3.0.1
        with:
          tag_name: ${{ steps.info.outputs.tag_name }}
          overwrite_files: ${{ inputs.overwrite }}
          files: audion_${{ steps.info.outputs.version }}_flatpak.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Discord notification
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VERSION: ${{ steps.info.outputs.version }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then exit 0; fi
          curl -H "Content-Type: application/json" -X POST -d "{\"embeds\": [{\"title\": \"📦 Flatpak build v$VERSION\", \"description\": \"Flatpak release has been ${{ github.event_name == 'push' && 'created' || 'updated' }}\", \"color\": 1947988, \"url\": \"https://github.com/${{ github.repository }}/releases/tag/v$VERSION\"}]}" "$DISCORD_WEBHOOK_URL"

  # ---------------------------------------------------------------------------
  # macOS Build
  # ---------------------------------------------------------------------------
  release-macos:
    runs-on: macos-latest
    needs: create-release
    if: |
      github.event_name == 'push' || inputs.build_macos == true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup (Node, Rust, cache, deps)
        uses: ./.github/actions/setup
        with:
          platform: macos
          rust_targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Build Tauri app (Universal)
        run: npm run tauri build -- --target universal-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Set version and prerelease flags
        id: info
        run: |
          echo "version=${{ needs.create-release.outputs.version }}" >> $GITHUB_OUTPUT
          echo "prerelease=${{ needs.create-release.outputs.prerelease }}" >> $GITHUB_OUTPUT
          echo "tag_name=${{ needs.create-release.outputs.tag_name }}" >> $GITHUB_OUTPUT

      - name: Rename artifacts
        run: |
          VER="${{ steps.info.outputs.version }}"
          echo "--- dmg dir ---"
          ls -la src-tauri/target/universal-apple-darwin/release/bundle/dmg/ || true
          echo "--- macos dir ---"
          ls -la src-tauri/target/universal-apple-darwin/release/bundle/macos/ || true
          mv src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg src-tauri/target/universal-apple-darwin/release/bundle/dmg/audion_${VER}_macos.dmg
          mv src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz src-tauri/target/universal-apple-darwin/release/bundle/macos/audion_${VER}_macos.app.tar.gz
          mv src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig src-tauri/target/universal-apple-darwin/release/bundle/macos/audion_${VER}_macos.app.tar.gz.sig

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3.0.1
        with:
          tag_name: ${{ steps.info.outputs.tag_name }}
          overwrite_files: ${{ inputs.overwrite }}
          files: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/audion_*_macos.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/audion_*_macos.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/audion_*_macos.app.tar.gz.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Discord notification
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VERSION: ${{ steps.info.outputs.version }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then exit 0; fi
          curl -H "Content-Type: application/json" -X POST -d "{\"embeds\": [{\"title\": \"🍎 macOS build v$VERSION\", \"description\": \"macOS release has been ${{ github.event_name == 'push' && 'created' || 'updated' }}\", \"color\": 1947988, \"url\": \"https://github.com/${{ github.repository }}/releases/tag/v$VERSION\"}]}" "$DISCORD_WEBHOOK_URL"

  # ---------------------------------------------------------------------------
  # Updater Manifest (latest.json) — one job per platform, each merges its own
  # entry into the shared manifest under a concurrency lock. no job waits on
  # the others to build; they only queue briefly to take turns writing
  # ---------------------------------------------------------------------------
  update-manifest-windows:
    runs-on: ubuntu-latest
    needs: [create-release, release-windows]
    if: needs.release-windows.result == 'success'
    concurrency:
      group: manifest-${{ needs.create-release.outputs.tag_name }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download .sig file from release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VER="${{ needs.create-release.outputs.version }}"
          TAG="${{ needs.create-release.outputs.tag_name }}"
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --pattern "audion_${VER}_windows.exe.sig" --dir sigs --clobber

      - name: Merge into latest.json
        uses: ./.github/actions/update-manifest
        with:
          version: ${{ needs.create-release.outputs.version }}
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          platform_key: windows-x86_64
          sig_path: sigs/audion_${{ needs.create-release.outputs.version }}_windows.exe.sig
          artifact_url: https://github.com/${{ github.repository }}/releases/download/${{ needs.create-release.outputs.tag_name }}/audion_${{ needs.create-release.outputs.version }}_windows.exe
          github_token: ${{ secrets.GITHUB_TOKEN }}

  update-manifest-macos:
    runs-on: ubuntu-latest
    needs: [create-release, release-macos]
    if: needs.release-macos.result == 'success'
    concurrency:
      group: manifest-${{ needs.create-release.outputs.tag_name }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download .sig file from release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VER="${{ needs.create-release.outputs.version }}"
          TAG="${{ needs.create-release.outputs.tag_name }}"
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --pattern "audion_${VER}_macos.app.tar.gz.sig" --dir sigs --clobber

      - name: Merge into latest.json
        uses: ./.github/actions/update-manifest
        with:
          version: ${{ needs.create-release.outputs.version }}
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          platform_key: darwin-x86_64,darwin-aarch64
          sig_path: sigs/audion_${{ needs.create-release.outputs.version }}_macos.app.tar.gz.sig
          artifact_url: https://github.com/${{ github.repository }}/releases/download/${{ needs.create-release.outputs.tag_name }}/audion_${{ needs.create-release.outputs.version }}_macos.app.tar.gz
          github_token: ${{ secrets.GITHUB_TOKEN }}

  update-manifest-linux:
    runs-on: ubuntu-latest
    needs: [create-release, release-linux]
    if: needs.release-linux.result == 'success'
    concurrency:
      group: manifest-${{ needs.create-release.outputs.tag_name }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download .sig file from release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VER="${{ needs.create-release.outputs.version }}"
          TAG="${{ needs.create-release.outputs.tag_name }}"
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --pattern "audion_${VER}_linux.AppImage.tar.gz.sig" --dir sigs --clobber

      - name: Merge into latest.json
        uses: ./.github/actions/update-manifest
        with:
          version: ${{ needs.create-release.outputs.version }}
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          platform_key: linux-x86_64
          sig_path: sigs/audion_${{ needs.create-release.outputs.version }}_linux.AppImage.tar.gz.sig
          artifact_url: https://github.com/${{ github.repository }}/releases/download/${{ needs.create-release.outputs.tag_name }}/audion_${{ needs.create-release.outputs.version }}_linux.AppImage.tar.gz
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Android Build
  # ---------------------------------------------------------------------------
  release-android:
    runs-on: ubuntu-latest
    needs: create-release
    if: |
      github.event_name == 'push' || inputs.build_android == true
    env:
      GRADLE_OPTS: -Xmx4096m
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Setup Node and Rust (composite action)
        uses: ./.github/actions/setup
        with:
          platform: android
          rust_targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache tauri-cli
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/tauri
          key: tauri-cli-2.11.0

      - name: Install tauri-cli (if not already)
        run: cargo install tauri-cli --version 2.11.0 --locked

      - name: Setup Signing
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > src-tauri/gen/android/release.keystore
          echo "${{ secrets.ANDROID_KEY_PROPERTIES }}" > src-tauri/gen/android/key.properties

      - name: Initialize Android project
        run: npm run tauri android init

      - name: Verify Android project initialized
        run: |
          test -f src-tauri/gen/android/app/src/main/java/com/audion/app/MainActivity.kt || {
            echo "::error::MainActivity.kt missing after init — tauri android init may have failed"
            exit 1
          }
          test -f src-tauri/gen/android/gradlew || {
            echo "::error::gradlew missing after init"
            exit 1
          }

      - name: Bundle libc++_shared.so into jniLibs
        run: |
          NDK_VERSION="29.0.14206865"
          NDK_DIR="${ANDROID_HOME}/ndk/${NDK_VERSION}"
          if [ ! -d "$NDK_DIR" ]; then
            echo "::error::NDK ${NDK_VERSION} not found at ${NDK_DIR}. Available NDKs:"
            ls -la "${ANDROID_HOME}/ndk/" || true
            exit 1
          fi
          # NDK r23+ moved libc++_shared.so out of sysroot/usr/lib/<abi>/
          # It now lives under toolchains/llvm/prebuilt/<host>/lib/ per target triple
          TOOLCHAIN="${NDK_DIR}/toolchains/llvm/prebuilt/linux-x86_64"
          JNI_DIR="src-tauri/gen/android/app/src/main/jniLibs"
          declare -A ABI_TRIPLE=(
            [arm64-v8a]=aarch64-linux-android
            [armeabi-v7a]=arm-linux-androideabi
            [x86]=i686-linux-android
            [x86_64]=x86_64-linux-android
          )
          for ABI in arm64-v8a armeabi-v7a x86 x86_64; do
            TRIPLE="${ABI_TRIPLE[$ABI]}"
            SO=$(find "${TOOLCHAIN}" -name "libc++_shared.so" -path "*/${TRIPLE}/*" | head -1)
            if [ -z "$SO" ]; then
              echo "ERROR: libc++_shared.so not found for ${ABI} (triple: ${TRIPLE})"
              find "${TOOLCHAIN}" -name "libc++_shared.so" || true
              exit 1
            fi
            mkdir -p "${JNI_DIR}/${ABI}"
            cp "$SO" "${JNI_DIR}/${ABI}/"
            echo "Copied: $SO -> ${JNI_DIR}/${ABI}/"
          done

      - name: Build Tauri app for Android (Signed)
        run: npm run tauri android build

      - name: Verify libc++_shared.so is bundled
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No APK found"
            exit 1
          fi
          echo "Checking APK: $APK"
          echo "--- All .so files in APK ---"
          unzip -l "$APK" | grep "\.so" || echo "WARNING: No .so files found at all"
          echo "--- libc++ check ---"
          if unzip -l "$APK" | grep -q "libc++_shared.so"; then
            echo "OK: libc++_shared.so is bundled"
          else
            echo "ERROR: libc++_shared.so NOT FOUND in APK — app will crash at launch"
            exit 1
          fi

      - name: Set version and prerelease flags
        id: info
        run: |
          echo "version=${{ needs.create-release.outputs.version }}" >> $GITHUB_OUTPUT
          echo "prerelease=${{ needs.create-release.outputs.prerelease }}" >> $GITHUB_OUTPUT
          echo "tag_name=${{ needs.create-release.outputs.tag_name }}" >> $GITHUB_OUTPUT

      - name: Rename Android artifacts
        run: |
          VER="${{ steps.info.outputs.version }}"
          # Universal APK path (most common)
          UNIVERSAL_APK="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk"
          if [ -f "$UNIVERSAL_APK" ]; then
            mv "$UNIVERSAL_APK" "src-tauri/gen/android/app/build/outputs/apk/audion_${VER}_android.apk"
            echo "APK renamed to audion_${VER}_android.apk"
          else
            # Fallback: search for any APK in release directories
            APK_FILE=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -1)
            if [ -n "$APK_FILE" ]; then
              mv "$APK_FILE" "src-tauri/gen/android/app/build/outputs/apk/audion_${VER}_android.apk"
              echo "APK renamed to audion_${VER}_android.apk"
            else
              echo "No APK found"
              exit 1
            fi
          fi

      - name: Upload Android artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "audion_*_android.apk")
          TAG="${{ steps.info.outputs.tag_name }}"
          CLOBBER=""
          if [ "${{ inputs.overwrite }}" = "true" ]; then CLOBBER="--clobber"; fi
          maxAttempts=3
          for attempt in $(seq 1 $maxAttempts); do
            echo "Upload attempt $attempt of $maxAttempts"
            if gh release upload "$TAG" "$APK" --repo "${{ github.repository }}" $CLOBBER; then
              break
            fi
            if [ "$attempt" -eq "$maxAttempts" ]; then
              echo "::error::Upload to release failed after $maxAttempts attempts"
              exit 1
            fi
            echo "Upload failed (likely a transient GitHub API error), retrying in 15s..."
            sleep 15
          done

      - name: Discord notification
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VERSION: ${{ steps.info.outputs.version }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then exit 0; fi
          curl -H "Content-Type: application/json" -X POST -d "{\"embeds\": [{\"title\": \"🤖 Android build v$VERSION\", \"description\": \"Android release has been ${{ github.event_name == 'push' && 'created' || 'updated' }}\", \"color\": 1947988, \"url\": \"https://github.com/${{ github.repository }}/releases/tag/v$VERSION\"}]}" "$DISCORD_WEBHOOK_URL"